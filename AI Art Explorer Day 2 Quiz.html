<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Art Explorer: Day 2 Quiz (40 Qs)</title>

<!-- Font: Montserrat -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- Tone.js for Sound Effects -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>

<style>
:root{
  /* Brand palette (warm cream + orange + espresso) */
  --bg:#fff8f3;
  --surface:#ffffff;
  --surface-soft:#fff3eb;
  --text:#2a2725;
  --muted:#6d6660;
  --line:#eadfd6;

  --header:#1f1b18;
  --headerText:#f6f3f1;

  --accent:#ef7d55;
  --accent-tint:#f3b09a;
  --accent-deep:#d8663f;

  /* Semantics */
  --correct:#16a34a; --correct-soft:#dcfce7;
  --wrong:#dc2626; --wrong-soft:#fee2e2;

  /* Matching helper fills */
  --pair1:#fefce8; --pair2:#f0fdf4; --pair3:#eff6ff; --pair4:#fdf2f8;
}

*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{
  font-family:'Montserrat', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; display:flex; flex-direction:column;
  overflow:hidden;
  --headerCurrentH: 48px;
  --footerCurrentH: 36px;
}

/* Common Header/Footer */
.bd-header{background:#212529; color:#f8f9fa; border-bottom:2px solid var(--accent); height:var(--headerCurrentH); overflow:hidden; transition:height 0.3s ease}
.bd-header .inner{max-width:1100px; margin:0 auto; padding:.4rem 1rem; display:flex; align-items:center; gap:1rem; height:100%}
.bd-header .sizer{margin-left:auto; display:none}
.bd-header.collapsed .sizer{display:flex}
.bd-toggle{background:transparent; color:#f8f9fa; border:1px solid #495057; padding:.2rem .4rem; border-radius:999px; font-weight:800; cursor:pointer; font-size:.75rem}
.bd-toggle:hover{background:#343a40}
.bd-header.collapsed .bd-brand, .bd-header.collapsed .bd-nav, .bd-header.collapsed .bd-search{display:none}
.bd-brand{font-weight:900; letter-spacing:.3px; color:#fff; text-decoration:none; font-size:.95rem; white-space:nowrap}
.bd-nav{margin-left:auto; display:flex; gap:.9rem; flex-wrap:wrap}
.bd-nav a{color:#ced4da; text-decoration:none; font-weight:700; font-size:.85rem}
.bd-nav a:hover{color:#fff}
.bd-search{display:flex; align-items:center; gap:.4rem}
.bd-search input{background:#343a40; color:#fff; border:1px solid #495057; padding:.35rem .5rem; border-radius:8px; width:150px; font-size:.85rem}
.bd-search button{background:var(--accent); color:#fff; border:none; padding:.35rem .6rem; border-radius:8px; font-weight:800; cursor:pointer; font-size:.85rem}
.bd-search button:hover{background:var(--accent-deep)}

/* Hamburger Menu */
.hamburger{display:none; background:transparent; border:none; color:#f8f9fa; font-size:1.5rem; cursor:pointer; padding:.25rem; margin-left:auto}
.hamburger-menu{display:none; position:fixed; top:var(--headerCurrentH); left:0; right:0; background:#212529; border-bottom:2px solid var(--accent); z-index:1000; padding:1rem; box-shadow:0 4px 6px rgba(0,0,0,0.3)}
.hamburger-menu.active{display:block}
.hamburger-menu .bd-nav{display:flex; flex-direction:column; gap:.75rem; margin:0 0 1rem 0}
.hamburger-menu .bd-search{display:flex; flex-direction:column; gap:.5rem; width:100%}
.hamburger-menu .bd-search input{width:100%}

.bd-footer{background:#212529; color:#ced4da; height:var(--footerCurrentH); overflow:hidden; border-top:1px solid #343a40; transition:height 0.3s ease}
.bd-footer .inner{max-width:1100px; margin:0 auto; padding:.25rem 1rem; display:flex; align-items:center; gap:1rem; height:100%; font-size:.75rem}
.bd-footer .expander{margin-left:auto; display:none}
.bd-footer.collapsed .expander{display:block}
.bd-footer.collapsed .inner > :not(.expander){display:none}

.content{flex:1 1 auto; display:flex; justify-content:center; padding:.5rem; min-height:calc(100vh - var(--headerCurrentH) - var(--footerCurrentH));}
.app{
  width:100%; max-width:860px; height:100%; background:var(--surface);
  border-radius:14px; box-shadow:0 10px 28px rgba(0,0,0,.08);
  display:flex; flex-direction:column; overflow:hidden;
}

/* App Header */
.app__header{background:var(--header); color:var(--headerText); padding:.8rem 1rem;}
.app__title{font-size:1.05rem; font-weight:800; letter-spacing:.3px; margin:0 0 .15rem}
.app__subtitle{font-size:.8rem; opacity:.9; margin:0 0 .45rem}
.progress{width:100%; height:6px; background:rgba(255,255,255,.25); border-radius:9999px; overflow:hidden;}
.progress__bar{height:100%; width:0%; background:var(--accent); border-radius:9999px; transition:width .3s ease;}
.meta{display:flex; gap:.4rem; margin-top:.45rem; flex-wrap:wrap; font-size:.7rem;}
.badge{background:rgba(255,255,255,.12); color:#fff; padding:.15rem .5rem; border-radius:999px; font-weight:600;}
.badge--score{background:rgba(255,255,255,.12); color:#ffe8d9;}

/* Main Content */
.main{ flex:1; overflow:auto; padding:1rem 1rem .6rem; }
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:1rem;}
.q-head{display:flex; align-items:flex-start; justify-content:space-between; gap:.8rem;}
.q-index{font-weight:800; color:var(--accent); font-size:.95rem}
.q-labels{display:flex; align-items:center; gap:.5rem;}
.q-category{font-size:.7rem; padding:.2rem .5rem; border-radius:999px; background:var(--surface-soft); border:1px solid var(--line); color:var(--muted); font-weight:700; text-transform:capitalize;}
.q-type{font-size:.72rem; padding:.2rem .5rem; border-radius:999px; background:var(--surface-soft); color:#5a2e1f; font-weight:700}
.q-text{margin:.6rem 0 .8rem; line-height:1.5; font-weight:600; font-size:1rem}

/* Options (MCQ/TF) */
.options{display:flex; flex-direction:column; gap:.45rem}
.option{border:1px solid var(--line); border-radius:10px; padding:.65rem .8rem; cursor:pointer; transition:.2s; background:#fff; position:relative;}
.option:hover{border-color:var(--accent); background:var(--accent-tint)}
.option.is-selected{border-color:var(--accent); background:var(--accent-tint)}
.option.is-correct{border-color:var(--correct); background:var(--correct-soft); color:var(--correct); font-weight:700}
.option.is-wrong{border-color:var(--wrong); background:var(--wrong-soft); color:var(--wrong); font-weight:700}
.option[disabled]{opacity:.75; pointer-events:none}

/* FTB Input */
.ftb input{width:100%; padding:.7rem .8rem; border:1px solid var(--line); border-radius:10px; font-size:.95rem;}
.ftb input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(239,125,85,.15)}

/* Sequence (Drag & Drop) */
.seq-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.4rem}
.seq-item{border:1px solid var(--line); border-radius:10px; background:#fff; padding:.6rem .8rem; display:flex; gap:.6rem; align-items:center; cursor:grab; user-select:none; touch-action:none;}
.seq-item .handle{opacity:.55}
.seq-item.dragging{opacity:.6; background:var(--accent-tint); border-color:var(--accent)}

/* Match (Tap-to-pair) */
.match{display:grid; gap:1rem;}
@media(min-width:760px){ .match{ grid-template-columns:1fr 1fr; } }
.mcol h4{margin:.1rem 0 .5rem; font-size:.9rem; color:var(--muted)}
.mitem{border:1px solid var(--line); border-radius:10px; background:#fff; padding:.55rem .7rem; cursor:pointer; transition:.2s; margin-bottom:.4rem;}
.mitem:hover{border-color:var(--accent); background:var(--accent-tint)}
.mitem.is-picked{border-color:var(--accent); box-shadow:0 0 0 3px rgba(239,125,85,.18)}
.mitem.paired-1{background:var(--pair1)}
.mitem.paired-2{background:var(--pair2)}
.mitem.paired-3{background:var(--pair3)}
.mitem.paired-4{background:var(--pair4)}
.mpair{font-size:.85rem; color:var(--muted); margin-top:.25rem}

/* RTC Context */
.rtc{border-left:4px solid var(--accent); background:var(--surface-soft); padding:.8rem .8rem; border-radius:8px; margin-bottom:.8rem; line-height:1.45; color:#5a2e1f;}

/* Explanation */
.expl{margin-top:.8rem; border-left:4px solid; padding:.75rem .8rem; border-radius:8px; line-height:1.55; display:none;}
.expl--ok{border-color:var(--correct); background:var(--correct-soft); color:var(--correct)}
.expl--no{border-color:var(--wrong); background:var(--wrong-soft); color:var(--wrong)}
.expl .model{margin-top:.5rem; font-weight:600}

/* Footer Navigation */
.nav{
  border-top:1px solid var(--line);
  padding:.7rem 1rem;
  display:grid;
  grid-template-columns:repeat(4, minmax(0,1fr));
  gap:.5rem;
  align-items:stretch;
  background:var(--surface);
}
.nav__primary{
  display:flex;
  justify-content:flex-end;
  gap:.35rem;
}
.nav .btn{
  width:100%;
}
.btn{border:none; border-radius:.65rem; padding:.55rem 1rem; font-weight:800; cursor:pointer; transition:.2s; font-size:.92rem;}
.btn--pri{background:var(--accent); color:#fff}
.btn--pri:hover{background:var(--accent-deep)}
.btn--sec{background:var(--surface-soft); color:var(--muted); border:1px solid var(--line)}
.btn--sec:hover{background:var(--accent-tint); color:#5a2e1f; border-color:var(--accent-tint)}
.btn[disabled]{opacity:.6; cursor:not-allowed}

/* Hint Modal */
.modal-overlay{position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:1000; opacity:0; pointer-events:none; transition:opacity .3s ease;}
.modal-overlay.visible{opacity:1; pointer-events:auto;}
.modal-content{background:var(--surface); padding:1.5rem 2rem; border-radius:12px; box-shadow:0 5px 15px rgba(0,0,0,0.3); max-width:500px; width:90%; text-align:center;}
.modal-content h3{margin-top:0; color:var(--accent);}
.modal-content p{line-height:1.6;}
.modal-close{margin-top:1rem;}

/* Small screens */
@media(max-width:768px){
  .hamburger{display:block}
  .bd-header .bd-nav, .bd-header .bd-search{display:none}
  body{
    --headerCurrentH: 44px;
    --footerCurrentH: 32px;
  }
}

@media(max-width:480px){
  .app__title{font-size:.95rem}
  .app__subtitle{font-size:.72rem}
  .q-text{font-size:.98rem; margin:.5rem 0 .7rem}
  .btn{font-size:.85rem; padding:.5rem .6rem}
  .main{padding:.75rem .75rem .5rem;}
  .card{padding:.9rem;}
  .options{gap:.35rem;}
  /* Mobile nav: compact, two-row layout to avoid text shifting */
  .nav{
    padding:.6rem .6rem;
    display:flex;
    flex-wrap:wrap;
    gap:.4rem;
  }
  .nav__btn{
    flex:1 1 calc(33.333% - .4rem);
  }
  .nav__primary{
    flex:1 1 100%;
    justify-content:space-between;
  }
  .nav__primary .nav__btn{
    flex:1 1 auto;
  }
}

/* Motion safe */
@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation:none !important}
}
</style>
</head>
<body>

<header class="bd-header">
  <div class="inner">
    <a class="bd-brand" href="/">AI Art Explorer</a>
    <nav class="bd-nav">
      <a href="#">Home</a>
      <a href="#">About</a>
    </nav>
    <form class="bd-search" onsubmit="event.preventDefault();">
      <input type="search" placeholder="Search..." aria-label="Search" />
      <button type="submit">Search</button>
    </form>
    <button class="hamburger" id="hamburgerBtn" aria-label="Menu">☰</button>
    <div class="sizer"><button id="toggleHeader" class="bd-toggle" title="Collapse header">▲</button></div>
  </div>
</header>

<div class="hamburger-menu" id="hamburgerMenu">
  <nav class="bd-nav">
    <a href="#">Home</a>
    <a href="#">About</a>
  </nav>
  <form class="bd-search" onsubmit="event.preventDefault();">
    <input type="search" placeholder="Search..." aria-label="Search" />
    <button type="submit">Search</button>
  </form>
</div>

<div class="content">
<div class="app" id="app">
  <header class="app__header">
    <h1 class="app__title">AI Art Explorer: Day 2</h1>
    <p class="app__subtitle">Advanced Techniques & Workflow Quiz (40 Questions)</p>
    <div class="progress"><div class="progress__bar" id="progressBar"></div></div>
    <div class="meta">
      <span class="badge" id="badgeIndex">Q 1 / 40</span>
      <span class="badge" id="badgeType">MCQ</span>
      <span class="badge" id="badgeMarks">10 Marks</span>
      <span class="badge badge--score" id="badgeScore">Score: 0</span>
    </div>
  </header>

  <main class="main">
    <div class="card" id="qCard">
      <!-- Question content will render here -->
    </div>
  </main>

  <footer class="nav">
    <button class="btn btn--sec nav__btn" id="btnPrev">← Prev</button>
    <button class="btn btn--sec nav__btn" id="btnHint">Hint (-5)</button>
    <button class="btn btn--sec nav__btn" id="btnSkip">Skip</button>
    <div class="nav__primary">
      <button class="btn btn--pri nav__btn" id="btnSubmit">Submit</button>
      <button class="btn btn--pri nav__btn" id="btnNext" style="display:none">Next →</button>
      <button class="btn btn--pri nav__btn" id="btnFinish" style="display:none">Finish</button>
    </div>
  </footer>
</div>
</div>

<footer class="bd-footer" id="bdFooter">
  <div class="inner">
    <div>© 2025 AI Art Explorer</div>
    <div class="expander"><button id="toggleFooter" class="bd-toggle" title="Expand footer">▼</button></div>
  </div>
</footer>

<!-- Hint Modal Structure -->
<div class="modal-overlay" id="hintModal">
  <div class="modal-content">
    <h3>Hint</h3>
    <p id="hintText"></p>
    <button class="btn btn--pri modal-close" id="closeHintModal">Got it!</button>
  </div>
</div>

<script>
// Layout controls
document.addEventListener('DOMContentLoaded', () => {
  const header = document.querySelector('.bd-header');
  const footer = document.getElementById('bdFooter');
  const toggleHeaderBtn = document.getElementById('toggleHeader');
  const toggleFooterBtn = document.getElementById('toggleFooter');
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const hamburgerMenu = document.getElementById('hamburgerMenu');

  function collapseHeader(){ document.body.style.setProperty('--headerCurrentH','3vh'); header.classList.add('collapsed'); }
  function expandHeader(){ document.body.style.setProperty('--headerCurrentH','48px'); header.classList.remove('collapsed'); }
  function collapseFooter(){ document.body.style.setProperty('--footerCurrentH','3vh'); footer.classList.add('collapsed'); }
  function expandFooter(){ document.body.style.setProperty('--footerCurrentH','36px'); footer.classList.remove('collapsed'); }
  
  if(toggleHeaderBtn) toggleHeaderBtn.addEventListener('click', () => header.classList.contains('collapsed') ? expandHeader() : collapseHeader());
  if(toggleFooterBtn) toggleFooterBtn.addEventListener('click', () => footer.classList.contains('collapsed') ? expandFooter() : collapseFooter());

  // Hamburger menu toggle
  if(hamburgerBtn && hamburgerMenu) {
    hamburgerBtn.addEventListener('click', () => {
      hamburgerMenu.classList.toggle('active');
    });
    
    // Close menu when clicking outside
    document.addEventListener('click', (e) => {
      if(!hamburgerBtn.contains(e.target) && !hamburgerMenu.contains(e.target)) {
        hamburgerMenu.classList.remove('active');
      }
    });
    
    // Close menu when clicking a link
    hamburgerMenu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        hamburgerMenu.classList.remove('active');
      });
    });
  }

  // On small screens, start with a compact header/footer to maximize quiz area
  if (window.matchMedia('(max-width: 768px)').matches) {
    collapseHeader();
    collapseFooter();
  }

  const app = document.getElementById('app');
  if(app) ['click','touchstart','keydown','wheel'].forEach(evt => app.addEventListener(evt, () => { collapseHeader(); collapseFooter(); }, { passive:true, once: true }));
});

/* ---------- DATA: 40 Day 2 questions ---------- */
const QUIZ = {
  subject: "AI Art",
  chapter: "Day 2: Advanced Techniques",
  total: 40,
  questions: [
    { type:"MCQ", category:"Consistency Tools", text:"Which parameter is used to reference the style of an existing image, ensuring stylistic consistency across your generations?", options:["--cref", "--sref", "--stylize", "--style"], correct:1, hint:"Think 'Style Reference'. It's about capturing the overall aesthetic, not a character.", explain:"The `--sref` (Style Reference) parameter is a powerful tool that uses an image URL to influence the style, color palette, and overall aesthetic of your generations." },
    { type:"MCQ", category:"Consistency Tools", text:"What is the primary function of the `--cref` parameter?", options:["To copy the exact composition of a reference image.", "To maintain the consistency of a character's appearance across different images.", "To reference the color palette of an image.", "To create a reference sheet for different art styles."], correct:1, hint:"The 'c' in 'cref' stands for 'Character'.", explain:"`--cref` (Character Reference) is used with an image URL of a character to maintain their facial features, hair, and clothing across various scenes and poses." },
    { type:"TF", category:"Consistency Tools", text:"True or False: Using `--sref` and `--cref` together is impossible and will always result in an error.", correct:false, hint:"Can you combine a character with a specific art style? Yes!", explain:"False. You can and often should use `--sref` and `--cref` together. This allows you to place a consistent character (`--cref`) into a scene with a consistent style (`--sref`)." },
    { type:"FTB", category:"Consistency Tools", text:"To adjust the influence of a style reference, you can use the `____` parameter, with values from 0 to 1000.", answer:"--sw", answerAlt:["--style weight", "sw"], hint:"It stands for 'Style Weight'.", explain:"The `--sw` (Style Weight) parameter controls how strongly the style reference (`--sref`) influences the job." },
    { type:"MATCH", category:"Advanced Parameters", text:"Match the parameter to its primary function.", stems:["--stylize", "--style raw", "--tile", "--cw"], responses:["Controls Midjourney's artistic influence", "Produces less 'opinionated' images", "Creates seamless, repeating patterns", "Adjusts character reference strength"], correct:[{s:0,r:0},{s:1,r:1},{s:2,r:2},{s:3,r:3}], hint:"Think about what each parameter name implies. `cw` is related to `cref`.", explain:"`--stylize` dictates how artistic the image is. `--style raw` reduces default aesthetic. `--tile` is for patterns. `--cw` modifies `--cref` strength." },
    { type:"SEQ", category:"Workflow Integration", text:"Arrange these steps into a logical 'Sketch-to-Art' workflow.", items:["Generate initial concepts in Midjourney.", "Create a refined sketch in Photoshop.", "Use the refined sketch as an `--sref` or image prompt.", "Generate the final, detailed AI artwork.", "Perform post-production edits."], correct:["Generate initial concepts in Midjourney.", "Create a refined sketch in Photoshop.", "Use the refined sketch as an `--sref` or image prompt.", "Generate the final, detailed AI artwork.", "Perform post-production edits."], hint:"The process moves from broad ideas to specific execution and final touches.", explain:"A common professional workflow involves using Midjourney for initial ideation, refining a chosen concept, feeding that back into Midjourney, and finally using tools like Photoshop for post-production." },
    { type:"MCQ", category:"Advanced Prompting", text:"In prompt engineering, what is the key difference between generating an 'asset' and creating a 'scene'?", options:["An asset is 2D, while a scene is 3D.", "An asset is isolated (e.g., 'a sword'), while a scene has context and mood.", "Assets are created with `--sref`, scenes with `--cref`.", "Assets are for games, scenes are for movies."], correct:1, hint:"Think about storytelling. Does 'a coin' tell a story, or does 'a tarnished coin on a tavern floor'?", explain:"An 'asset' is a decorative object. A 'scene' places that object in an environment, giving it context, story, and mood." },
    { type:"RTC", category:"Storytelling & Prompting", context:"<strong>Weak Prompt:</strong> 'Mask with colors and design, detailed background.'<br><strong>Goal:</strong> An image that feels ancient and mysterious.", text:"Analyze the weak prompt and fix it.", subs:[{stype:"MCQ", text:"What is the main flaw in the 'Weak Prompt'?", options:["It's too long.", "It uses negative prompts incorrectly.", "It's vague and lacks specific context.", "It doesn't specify the camera angle."], correct:2}, {stype:"MCQ", text:"Which is the best revision?", options:["Mask, --ar 16:9 --v 6", "Ancient mask on stone altar, torchlit temple, cinematic shadows, epic mood.", "A very colorful and detailed mask, intricate background details, 4k.", "Image of a mask NOT blue."], correct:1}], hint:"The prompt is too generic. Good prompts set a scene.", explain:"The fixed prompt transforms the request by setting a scene. It adds specific objects, lighting, and mood." },
    { type:"TF", category:"Advanced Parameters", text:"True or False: A lower `--stylize` value (e.g., 50) will result in an image that is more artistic and less faithful to the prompt.", correct:false, hint:"Does 'stylize' mean more or less artistic influence from the AI?", explain:"False. A lower `--stylize` value tells Midjourney to follow your prompt more literally. A higher value gives the AI more creative freedom." },
    { type:"MCQ", category:"Enterprise & Workflow", text:"In a professional context, why is creating 'compliant art' important?", options:["It ensures the art uses a specific color palette.", "It avoids copyright infringement and adheres to brand guidelines.", "It means the art was created using only Photoshop.", "It guarantees the image will be popular on social media."], correct:1, hint:"Enterprises need to manage legal risks and maintain a consistent brand identity.", explain:"Compliant art is crucial for businesses. It means the artwork is legally safe to use and aligns with the company's visual identity." },
    { type:"FTB", category:"Advanced Prompting", text:"A prompt that has too many contradictory ideas, like 'minimalist ornate detailed armor', is known as a `____` prompt.", answer:"cluttered", hint:"It's like having too much stuff in a small room.", explain:"A cluttered prompt confuses the AI with conflicting instructions. The best prompts are layered and consistent, not contradictory." },
    { type:"MATCH", category:"Consistency Tools", text:"Match the tool/parameter to its specific consistency role.", stems:["--sref URL", "--cref URL", "Consistent Prompt Structure", "Seed Number"], responses:["Maintains Style/Aesthetic", "Maintains Character Identity", "Maintains Composition/Layout", "Maintains Noise Pattern/Details"], correct:[{s:0,r:0},{s:1,r:1},{s:2,r:2},{s:3,r:3}], hint:"Each tool controls a different layer of consistency.", explain:"`--sref` is for style. `--cref` is for characters. Consistent prompt structure helps composition. Seed helps maintain fine details." },
    { type:"MCQ", category:"Workflow Integration", text:"What is a primary advantage of using Adobe Firefly in conjunction with Midjourney?", options:["Firefly generates images faster than Midjourney.", "Firefly's Generative Fill can easily add or remove elements and fix details.", "Midjourney cannot create images with text.", "Firefly is better for creating initial concepts."], correct:1, hint:"Think about post-production. What if your Midjourney image is perfect except for one small flaw?", explain:"Adobe Firefly excels at 'surgical' edits. Its Generative Fill feature is perfect for fixing hands, removing unwanted artifacts, or adding new elements." },
    { type:"TF", category:"Advanced Prompting", text:"True or False: When trying to create a story-driven scene, it's best to describe only the main object and let the AI figure out the background.", correct:false, hint:"Does a story happen in a vacuum? The background is part of the narrative.", explain:"False. This is a common pitfall called 'missing context'. The background and environment are just as important as the main subject." },
    { type:"SEQ", category:"Prompt Refinement", text:"Arrange these elements in order of importance for creating a strong, scene-based prompt.", items:["Add a specific setting (e.g., 'in a temple').", "Define the main subject (e.g., 'a golden phoenix').", "Add mood and lighting (e.g., 'epic mood, cinematic shadows').", "Specify a camera shot (e.g., 'wide angle shot')."], correct:["Define the main subject (e.g., 'a golden phoenix').", "Add a specific setting (e.g., 'in a temple').", "Add mood and lighting (e.g., 'epic mood, cinematic shadows').", "Specify a camera shot (e.g., 'wide angle shot')."], hint:"Start with the 'who' or 'what', then the 'where', then the 'how it feels'.", explain:"A strong prompt builds layers. Start with your core subject. Then, place it in a specific context. After that, add mood and lighting." },
    { type:"MCQ", category:"Advanced Parameters", text:"What does using `--style raw` typically do to an image?", options:["It makes the image black and white.", "It increases the artistic stylization significantly.", "It removes Midjourney's default aesthetic, resulting in a more photographic look.", "It creates a raw, uncompressed image file."], correct:2, hint:"Think 'raw' as in unfiltered or less processed.", explain:"`--style raw` tones down the default beautification and artistic flair, useful for more realistic or photographic results." },
    { type:"FTB", category:"Workflow Integration", text:"In an enterprise setting, ensuring AI art can be produced consistently and in large volumes is known as `____`.", answer:"scalability", hint:"This term is used when a process can handle a growing amount of work.", explain:"Scalability means the AI art creation workflow is efficient and repeatable, allowing the team to produce a large number of high-quality, consistent assets." },
    { type:"TF", category:"Consistency Tools", text:"True or False: The `--cw` parameter can be used to control the strength of an `--sref` image.", correct:false, hint:"`--cw` stands for Character Weight. Which reference does that relate to?", explain:"False. `--cw` (Character Weight) specifically adjusts the strength of `--cref`. The equivalent for style reference is `--sw` (Style Weight)." },
    { type:"MCQ", category:"Advanced Prompting", text:"Using permutation prompts like `{red, blue, green} car` is an effective way to:", options:["Blend the colors red, blue, and green into one car.", "Rapidly generate three separate jobs: one for a red car, one for a blue car, and one for a green car.", "Ask the AI to choose the best color for the car.", "Create a car with red, blue, and green stripes."], correct:1, hint:"The curly braces create multiple, distinct versions of the prompt.", explain:"Permutation prompts are a powerful feature for rapid exploration. You instruct Midjourney to create a separate job for each option." },
    { type:"MATCH", category:"Prompting Pitfalls", text:"Match the prompt pitfall to its description.", stems:["Vague Prompt", "Cluttered Prompt", "Missing Context"], responses:["AI fills in the blanks randomly", "Contradictory ideas confuse the AI", "Subject looks pasted on, not part of a scene"], correct:[{s:0,r:0},{s:1,r:1},{s:2,r:2}], hint:"Each pitfall represents a different kind of unclear instruction.", explain:"Vague prompts give the AI too much freedom. Cluttered prompts give it impossible instructions. Missing context results in sterile, isolated subjects." },
    { type:"MCQ", category:"Storytelling", text:"When moving from a 'symbol' to a 'story' in a prompt, what is the most important element to add?", options:["Higher resolution.", "More colors.", "Context and mood.", "The `--v 6` parameter."], correct:2, hint:"A story is more than just an object; it's an experience.", explain:"The transformation from a symbol to a story happens when you add context (where is the object?), mood (how does it feel?), and action." },
    { type:"RTC", category:"Workflow & Tools", context:"<strong>Goal:</strong> Produce 20 unique potion icons with a consistent 'glowing, painterly' art style.<br><strong>Asset:</strong> A single JPG image showing the target art style.", text:"A game design team needs to create consistent icons.", subs:[{stype:"MCQ", text:"Which parameter is essential for the team to use in every prompt to maintain the art style?", options:["--cref", "--tile", "--sref", "--chaos 100"], correct:2}, {stype:"MCQ", text:"To efficiently generate many different potion shapes, what prompt structure could they use?", options:["Repeating the same prompt 20 times.", "Using a permutation prompt like 'magic potion in a {tall, round, square, ornate} bottle'.", "Using the `/describe` command.", "Using `--style raw`."], correct:1}], hint:"`--sref` maintains style. Permutation prompts create variations.", explain:"`--sref` with the style guide image ensures consistency. A permutation prompt efficiently generates multiple variations." },
    { type:"TF", category:"Advanced Parameters", text:"True or False: The `--tile` parameter is best used for creating character portraits.", correct:false, hint:"What does a 'tile' on a floor or wall do? It repeats.", explain:"False. The `--tile` parameter is specifically designed to create seamless, repeating patterns. It's ideal for textures and wallpapers." },
    { type:"FTB", category:"Consistency Tools", text:"If you have an image of a full character but only want to reference their face, you should use an image editor to `____` the face before uploading it for `--cref`.", answer:"crop", hint:"You need to isolate the part you want the AI to focus on.", explain:"For the best `--cref` results, you should provide a clear, well-lit image of the specific features you want to replicate. Cropping helps focus." },
    { type:"MCQ", category:"Workflow Integration", text:"What is the final step in a professional 'sketch-to-art' workflow after the AI has generated the main image?", options:["Submitting it to a contest.", "Upscaling the image.", "Post-production and integration.", "Creating a new sketch."], correct:2, hint:"The raw output from the AI is rarely the final product in a commercial pipeline.", explain:"Post-production is the crucial final stage. This can involve color correction, fixing minor AI errors, compositing, or adding text and UI elements." },
    { type:"MCQ", category:"Storytelling", text:"Which of these prompts is the best example of setting a scene rather than just describing an asset?", options:["A detailed medieval coin.", "Golden coin, intricate design, high resolution.", "Tarnished gold coin on the wet cobblestones of a foggy medieval alley, cinematic lighting.", "Coin --v 6 --ar 1:1."], correct:2, hint:"Look for the prompt that tells a mini-story.", explain:"The third option is a full scene. It provides a subject, a specific location, and mood. This creates a much more evocative and story-rich image." },
    { type:"TF", category:"Enterprise & Workflow", text:"True or False: For enterprise needs, the main goal is to create the most artistic and experimental images possible, regardless of consistency.", correct:false, hint:"Do big brands prefer wild, unpredictable art or a consistent, reliable look?", explain:"False. For enterprise use, key goals are compliance, scalability, and consistency. Artistic quality must exist within these professional constraints." },
    { type:"SEQ", category:"Troubleshooting", text:"Your character generations with `--cref` are inconsistent. Arrange these troubleshooting steps from most likely to least likely to solve the problem.", items:["Use a clearer, well-lit, cropped image of the character's face.", "Increase the Character Weight using `--cw 100`.", "Use the same `--seed` number for subtle variations.", "Change the Midjourney version from 6 to 5.2."], correct:["Use a clearer, well-lit, cropped image of the character's face.", "Increase the Character Weight using `--cw 100`.", "Use the same `--seed` number for subtle variations.", "Change the Midjourney version from 6 to 5.2."], hint:"The quality of the input reference is the most important factor.", explain:"The quality of the reference image is paramount. After that, adjusting the weight with `--cw` is the next logical step." },
    { type:"FTB", category:"Advanced Parameters", text:"The parameter `--stylize`, which controls Midjourney's artistic training, can also be written in a shorthand version as `____`.", answer:"--s", hint:"It's just the first letter of the full parameter name.", explain:"Many Midjourney parameters have shorthand versions. `--stylize` can be abbreviated to `--s`. For example, `--s 250`." },
    { type:"MATCH", category:"Workflow & Tools", text:"Match the tool to its best-use case in an integrated AI art workflow.", stems:["Midjourney", "Photoshop (Manual)", "Photoshop (Firefly)", "Typography Tool"], responses:["Rapid concept generation and scene creation", "Precise manual sketching and color correction", "Seamlessly adding/removing elements with AI", "Generating text and typographic designs"], correct:[{s:0,r:0},{s:1,r:1},{s:2,r:2},{s:3,r:3}], hint:"Each tool has its own strengths. Midjourney is for generating, Photoshop is for refining.", explain:"A powerful workflow uses each tool for what it does best. Midjourney for generation, Photoshop for manual edits, Firefly for AI-assisted edits." },
    { type:"TF", category:"Advanced Prompting", text:"True or False: Adding 'cinematic lighting, epic mood' to a prompt is generally considered a bad practice because it's too vague.", correct:false, hint:"Do these terms help the AI understand the desired 'vibe' of the image?", explain:"False. These are powerful descriptors that tap into the model's training on movie stills and dramatic art. They are key techniques for transforming a simple description into an evocative scene." },
    { type:"MCQ", category:"Consistency Tools", text:"If your `--sref` is making the image *too* much like the style reference and ignoring your prompt, what should you do?", options:["Increase the stylize value with `--s 1000`.", "Lower the style weight with `--sw 50`.", "Use `--cref` instead.", "Make your prompt much longer."], correct:1, hint:"You need to reduce the *influence* of the style reference image.", explain:"The `--sw` (Style Weight) parameter is the direct control for this problem. Lowering it tells Midjourney to pay less attention to the `--sref` image." },
    { type:"RTC", category:"Real-World Application", context:"<strong>Character:</strong> Lyra, an elf with silver hair and green eyes.<br><strong>Style:</strong> Glowing watercolor concept art.<br><strong>Assets:</strong> lyra.jpg (portrait) and style.jpg (art style example).", text:"You are creating images for a fantasy game.", subs:[{stype:"MCQ", text:"To create an image of 'Lyra walking through a forest', what is the best prompt structure?", options:["Lyra walking through a forest --v 6", "lyra.jpg style.jpg Lyra walking through a forest", "Lyra walking through a forest --cref [lyra.jpg URL] --sref [style.jpg URL]", "/imagine prompt: Lyra walking in a forest"], correct:2}, {stype:"MCQ", text:"The director feels the character's face isn't quite right. What is the first thing to check?", options:["Ensure the `--cref` image is a clear, cropped, well-lit portrait of Lyra's face.", "Increase the `--sw` value to 1000.", "Change the prompt to be more descriptive of Lyra's face.", "Use the `/describe` command on the lyra.jpg image."], correct:0}], hint:"Use both `--cref` and `--sref`. Quality of the reference image is paramount.", explain:"This prompt correctly uses both essential parameters. The quality of the character reference image is the most important factor." },
    { type:"MCQ", category:"Advanced Parameters", text:"When would you most likely use the `--weird` parameter?", options:["To fix errors in an image.", "To get more conventional, mainstream results.", "To explore unusual aesthetics and get surreal, unexpected outputs.", "To make an image look more photorealistic."], correct:2, hint:"The name of the parameter is a very direct clue to its function.", explain:"The `--weird` parameter injects a dose of surrealism and strangeness into your generations. It's perfect for exploring unique and bizarre visual territories." },
    { type:"TF", category:"Workflow Integration", text:"True or False: A professional AI art workflow involves using one single tool (e.g., Midjourney) exclusively to go from idea to final product.", correct:false, hint:"Is one tool usually the best at everything? (Concept, generation, editing, typography...)", explain:"False. A powerful, flexible workflow almost always involves integrating multiple tools. Midjourney for generation, Photoshop or other editors for refinement." },
    { type:"FTB", category:"Storytelling", text:"Transforming the prompt 'a key' into 'an ornate key in a rusty lock on an ancient wooden chest' is an example of adding `____`.", answer:"context", hint:"You are giving the object a place and a purpose, not just describing it.", explain:"Adding context is the most important step in moving from a simple asset to a story-driven scene. By describing where the object is and what it's interacting with, you create a narrative." },
    { type:"SEQ", category:"Enterprise Workflow", text:"Arrange these stages of an enterprise art asset pipeline in the correct order.", items:["AI Generation (Midjourney).", "Define Requirements (Style Guide, Asset List).", "Quality Assurance & Compliance Check.", "Post-Production & Integration."], correct:["Define Requirements (Style Guide, Asset List).", "AI Generation (Midjourney).", "Post-Production & Integration.", "Quality Assurance & Compliance Check."], hint:"You must know what to make before you can make it. Checking your work is the final step.", explain:"A professional pipeline starts with clear requirements. Then, assets are generated. Post-production refines these assets. Finally, QA ensures all assets meet standards." },
    { type:"MCQ", category:"Consistency Tools", text:"You used `--sref` with a sketch, but the final image is too sketchy. How do you get a more 'finished' look while keeping the sketch's composition?", options:["Use a different sketch.", "Lower the `--sw` (Style Weight) value.", "Use the sketch as a base image prompt instead of `--sref`.", "Increase the `--chaos` value."], correct:1, hint:"You want less of the 'sketch' style and more of the Midjourney 'finished' style.", explain:"Lowering the Style Weight (`--sw`) is the most direct way to solve this. It tells Midjourney to take inspiration from the layout but apply less of the 'sketchy' texture." },
    { type:"TF", category:"Advanced Parameters", text:"True or False: Using `--stop 50` will result in a more detailed and fully rendered image.", correct:false, hint:"Does 'stop' mean go further or finish early?", explain:"False. The `--stop` parameter halts the generation process early. `--stop 50` means the job will stop when it's 50% complete, resulting in a less detailed image." },
    { type:"MATCH", category:"Prompting Concepts", text:"Match the prompt concept to its example.", stems:["Asset", "Scene", "Permutation", "Negative Prompt"], responses:["`golden chalice`", "`golden chalice on a king's table, feast, celebration`", "`golden {chalice, crown, scepter}`", "`golden chalice --no text`"], correct:[{s:0,r:0},{s:1,r:1},{s:2,r:2},{s:3,r:3}], hint:"An asset is an object, a scene is a story, a permutation is for options, and a negative prompt is for removal.", explain:"This covers four core prompting concepts. An Asset is a single object. A Scene adds story. A Permutation creates multiple jobs. A Negative Prompt removes unwanted elements." }
  ]
};

/* ---------- STATE ---------- */
let idx = 0;
let score = 0;
const answers = new Array(QUIZ.questions.length).fill(null);
const hintsUsed = new Array(QUIZ.questions.length).fill(false);

/* ---------- SOUNDS ---------- */
let soundReady = false;
const correctSynth = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.005, decay: 0.1, sustain: 0.3, release: 1 } }).toDestination();
const wrongSynth = new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.01, decay: 0.4, sustain: 0.1, release: 1 } }).toDestination();

// Start audio context on first user interaction
document.body.addEventListener('click', async () => {
    if (!soundReady) {
        await Tone.start();
        soundReady = true;
    }
}, { once: true });


/* ---------- HELPERS ---------- */
const el = sel => document.querySelector(sel);
const qCard = el('#qCard');
const progressBar = el('#progressBar');
const badgeIndex = el('#badgeIndex');
const badgeType = el('#badgeType');
const badgeMarks = el('#badgeMarks');
const badgeScore = el('#badgeScore');
const btnPrev = el('#btnPrev');
const btnNext = el('#btnNext');
const btnSubmit = el('#btnSubmit');
const btnSkip = el('#btnSkip');
const btnHint = el('#btnHint');
const btnFinish = el('#btnFinish');
const hintModal = el('#hintModal');
const hintText = el('#hintText');
const closeHintModal = el('#closeHintModal');


function updateHeader(){
  const totalQuestions = QUIZ.questions.length;
  badgeIndex.textContent = `Q ${idx+1} / ${totalQuestions}`;
  badgeType.textContent = QUIZ.questions[idx].type;
  badgeMarks.textContent = `10 Marks`;
  badgeScore.textContent = `Score: ${score}`;
  const pct = ((idx)/totalQuestions)*100;
  progressBar.style.width = `${pct}%`;
}
function setButtonsState(afterSubmit=false){
  const totalQuestions = QUIZ.questions.length;
  btnPrev.disabled = idx===0;
  btnNext.style.display = afterSubmit && idx < totalQuestions - 1 ? 'inline-block':'none';
  btnSubmit.style.display = afterSubmit ? 'none':'inline-block';
  btnSkip.style.display = afterSubmit ? 'none':'inline-block';
  btnHint.style.display = afterSubmit ? 'none' : 'inline-block';
  btnHint.disabled = hintsUsed[idx];
  btnFinish.style.display = afterSubmit && idx === totalQuestions - 1 ? 'inline-block':'none';
}

/* ---------- RENDERERS ---------- */
function render(){
  updateHeader();
  qCard.innerHTML = '';
  const q = QUIZ.questions[idx];

  // Head
  const head = document.createElement('div');
  head.className='q-head';
  head.innerHTML = `
    <div class="q-index">Question ${idx+1}</div>
    <div class="q-labels">
      <span class="q-category">${q.category}</span>
      <span class="q-type">${q.type}</span>
    </div>
  `;
  qCard.appendChild(head);

  // Question text / context
  if(q.type==='RTC' && q.context){
    const ctx = document.createElement('div');
    ctx.className='rtc';
    ctx.innerHTML = q.context;
    qCard.appendChild(ctx);
  }
  const qtext = document.createElement('div');
  qtext.className='q-text';
  qtext.innerHTML = q.text || '';
  qCard.appendChild(qtext);

  // Body per type
  if(q.type==='MCQ' || q.type==='TF'){
    const optionsWrap = document.createElement('div');
    optionsWrap.className='options';
    const opts = (q.type==='TF') ? ['True','False'] : q.options;
    opts.forEach((opt,i)=>{
      const div = document.createElement('div');
      div.className='option';
      div.dataset.index=i;
      div.innerHTML=opt;
      div.addEventListener('click',()=>selectOption(div,i));
      optionsWrap.appendChild(div);
    });
    qCard.appendChild(optionsWrap);
    restoreMCQ();
  }
  else if(q.type==='FTB'){
    const wrap = document.createElement('div'); wrap.className='ftb';
    wrap.innerHTML = `<input id="ftb" placeholder="Type your answer..." autocomplete="off">`;
    qCard.appendChild(wrap);
    if(typeof answers[idx]==='string') el('#ftb').value = answers[idx];
  }
  else if(q.type==='SEQ'){
    const list = document.createElement('ul'); list.className='seq-list'; list.id='seqList';
    const items = answers[idx] && Array.isArray(answers[idx]) ? answers[idx] : shuffle([...q.items]);
    items.forEach(t=>{
      const li = document.createElement('li'); li.className='seq-item'; li.draggable=true;
      li.innerHTML = `<span class="handle">☰</span><span class="txt">${t}</span>`;
      list.appendChild(li);
    });
    addDnD(list);
    qCard.appendChild(list);
  }
  else if(q.type==='MATCH'){
    const wrap = document.createElement('div'); wrap.className='match';
    const A = document.createElement('div'); A.className='mcol';
    A.innerHTML = `<h4>Column A</h4>`;
    q.stems.forEach((s,i)=>{
      const d = document.createElement('div'); d.className='mitem'; d.innerHTML=s; d.dataset.side='A'; d.dataset.index=i;
      d.addEventListener('click',()=>pickMatch(d));
      A.appendChild(d);
    });
    const B = document.createElement('div'); B.className='mcol';
    B.innerHTML = `<h4>Column B</h4>`;
    q.responses.forEach((r,i)=>{
      const d = document.createElement('div'); d.className='mitem'; d.innerHTML=r; d.dataset.side='B'; d.dataset.index=i;
      d.addEventListener('click',()=>pickMatch(d));
      B.appendChild(d);
    });
    wrap.appendChild(A); wrap.appendChild(B);
    const pairsInfo = document.createElement('div'); pairsInfo.id='pairsInfo'; pairsInfo.style.marginTop='.3rem';
    wrap.appendChild(pairsInfo);
    qCard.appendChild(wrap);
    restoreMatch();
  }
  else if(q.type==='RTC'){
    q.subs.forEach((sub,si)=>{
      const box = document.createElement('div'); box.style.margin='0.6rem 0 0';
      const st = document.createElement('div'); st.className='q-text'; st.style.fontWeight='600';
      st.innerHTML = (si+1)+'. '+sub.text;
      box.appendChild(st);
      if(sub.stype==='MCQ'){
        const opts = document.createElement('div'); opts.className='options';
        sub.options.forEach((o,i)=>{
          const d=document.createElement('div'); d.className='option'; d.dataset.si=si; d.dataset.index=i;
          d.innerHTML=o;
          d.addEventListener('click',()=>selectRTCOption(d,si,i));
          opts.appendChild(d);
        });
        box.appendChild(opts);
      }else if(sub.stype==='FTB'){
        const wrap = document.createElement('div'); wrap.className='ftb';
        wrap.innerHTML=`<input data-si="${si}" class="rtc-ftb" placeholder="Type answer...">`;
        box.appendChild(wrap);
      }
      qCard.appendChild(box);
    });
    restoreRTC();
  }

  const expl = document.createElement('div'); expl.className='expl'; expl.id='expl';
  qCard.appendChild(expl);
  
  setButtonsState(false);
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]} return a; }

/* ----- Interactions per type ----- */
function selectOption(div,i){
  qCard.querySelectorAll('.option').forEach(o=>o.classList.remove('is-selected'));
  div.classList.add('is-selected');
  answers[idx] = i;
}

function restoreMCQ(){
  const val = answers[idx];
  if(val===null || typeof val==='undefined') return;
  const opt = qCard.querySelector(`.option[data-index="${val}"]`);
  if(opt) opt.classList.add('is-selected');
}

function addDnD(list){
  let dragEl=null;
  list.querySelectorAll('.seq-item').forEach(li=>{
    li.addEventListener('dragstart', ()=>{ dragEl=li; li.classList.add('dragging'); });
    li.addEventListener('dragend', ()=>{ li.classList.remove('dragging'); });
    // Touch events for mobile
    li.addEventListener('touchstart', (e)=>{ dragEl=li; li.classList.add('dragging'); }, {passive:true});
    li.addEventListener('touchend', ()=>{ if(dragEl) dragEl.classList.remove('dragging'); dragEl=null; });
    li.addEventListener('touchmove', (e)=>{
      if(!dragEl) return;
      e.preventDefault();
      const touch = e.touches[0];
      const after = getDragAfterElement(list, touch.clientY);
      if(dragEl) after==null ? list.appendChild(dragEl) : list.insertBefore(dragEl, after);
    }, {passive:false});
  });
  list.addEventListener('dragover', e=>{
    e.preventDefault();
    const after = getDragAfterElement(list, e.clientY);
    if(dragEl) after==null ? list.appendChild(dragEl) : list.insertBefore(dragEl, after);
  });
  function getDragAfterElement(container, y){
    const els=[...container.querySelectorAll('.seq-item:not(.dragging)')];
    return els.reduce((closest,child)=>{
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height/2;
      if(offset<0 && offset>closest.offset) return {offset, element:child};
      else return closest;
    }, {offset:Number.NEGATIVE_INFINITY}).element;
  }
}

let pickedA=null, pickedB=null;
function pickMatch(node){
  const side=node.dataset.side;
  if(side==='A'){ if(pickedA===node){ node.classList.remove('is-picked'); pickedA=null; } else { if(pickedA) pickedA.classList.remove('is-picked'); pickedA=node; node.classList.add('is-picked'); } }
  if(side==='B'){ if(pickedB===node){ node.classList.remove('is-picked'); pickedB=null; } else { if(pickedB) pickedB.classList.remove('is-picked'); pickedB=node; node.classList.add('is-picked'); } }
  if(pickedA && pickedB){
    const colorClass = `paired-${(getPairs().length % 4)+1}`;
    pickedA.classList.remove('is-picked'); pickedB.classList.remove('is-picked');
    pickedA.classList.add(colorClass); pickedB.classList.add(colorClass);
    const pair = {s:parseInt(pickedA.dataset.index), r:parseInt(pickedB.dataset.index), c:colorClass};
    const current = getPairs(); current.push(pair); setPairs(current);
    updatePairsInfo();
    pickedA=null; pickedB=null;
  }
}
function getPairs(){ return (answers[idx] && Array.isArray(answers[idx])) ? answers[idx] : []; }
function setPairs(p){ answers[idx]=p; }
function updatePairsInfo(){
  const q = QUIZ.questions[idx];
  const div = el('#pairsInfo');
  const pairs = getPairs();
  const lines = pairs.map(pr=> `${q.stems[pr.s]} → ${q.responses[pr.r]}`);
  div.innerHTML = lines.length? `<div class="mpair"><strong>Pairs:</strong><br>${lines.join('<br>')}</div>` : '';
}
function restoreMatch(){
  const pairs = getPairs();
  if(!pairs.length) return;
  pairs.forEach(pr=>{
    const A = qCard.querySelector(`.mitem[data-side="A"][data-index="${pr.s}"]`);
    const B = qCard.querySelector(`.mitem[data-side="B"][data-index="${pr.r}"]`);
    if(A && B){ A.classList.add(pr.c); B.classList.add(pr.c); }
  });
  updatePairsInfo();
}

function selectRTCOption(div,si,i){
  const q = QUIZ.questions[idx];
  if(!answers[idx]) answers[idx] = {subs: new Array(q.subs.length).fill(null)};
  qCard.querySelectorAll(`.option[data-si="${si}"]`).forEach(o=>o.classList.remove('is-selected'));
  div.classList.add('is-selected');
  answers[idx].subs[si] = i;
}
function restoreRTC(){
  const q = QUIZ.questions[idx];
  if(!answers[idx] || !answers[idx].subs) return;
  q.subs.forEach((s,si)=>{
    const val = answers[idx].subs[si];
    if(s.stype==='MCQ' && val!==null){
      const opt = qCard.querySelector(`.option[data-si="${si}"][data-index="${val}"]`);
      if(opt) opt.classList.add('is-selected');
    }
    if(s.stype==='FTB' && typeof val==='string'){
      const input = qCard.querySelector(`.rtc-ftb[data-si="${si}"]`); if(input) input.value = val;
    }
  });
}

/* ---------- SUBMIT / CHECK ---------- */
function showExplanation(ok, model=null){
  const box = el('#expl'); if(!box) return;
  box.classList.remove('expl--ok','expl--no'); box.style.display='block';
  const q = QUIZ.questions[idx];
  box.classList.add(ok?'expl--ok':'expl--no');
  box.innerHTML = '<div><strong>' + (ok ? 'Correct!' : 'Review:') + '</strong> ' + (q.explain || '') + '</div>' + (model ? '<div class="model">' + model + '</div>' : '');
  setButtonsState(true);
  // Scroll explanation into view
  box.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function grade(){
  const q = QUIZ.questions[idx];
  let ok=false, modelTxt='';
  let scored = false;
  if(answers[idx] === '__scored__' || (answers[idx] && answers[idx]._scored)) {
      scored = true;
  }

  if(q.type==='MCQ' || q.type==='TF'){
    const val = answers[idx];
    if(val===null){ showExplanation(false, 'Please select an option.'); return; }
    qCard.querySelectorAll('.option').forEach(o=>o.setAttribute('disabled',''));
    const correctIndex = (q.type==='TF' ? (q.correct?0:1) : q.correct);
    qCard.querySelectorAll('.option').forEach((o,i)=>{
      if(i === correctIndex) o.classList.add('is-correct');
      else if(i===val) o.classList.add('is-wrong');
    });
    ok = (q.type==='TF') ? ((val===0)===q.correct) : (val===q.correct);
    const correctText = q.type==='TF' ? (q.correct ? 'True' : 'False') : (q.options[correctIndex]);
    modelTxt = `Correct Answer: <strong>${correctText}</strong>`;
  }
  else if(q.type==='FTB'){
    const input = el('#ftb');
    const val = (input.value||'').trim().toLowerCase();
    answers[idx]=val;
    const targets = [q.answer.toLowerCase(), ...(q.answerAlt||[]).map(x=>x.toLowerCase())];
    ok = targets.includes(val);
    modelTxt = `Model Answer: <strong>${q.answer}</strong>`;
    input.setAttribute('disabled','');
  }
  else if(q.type==='SEQ'){
    const order = [...qCard.querySelectorAll('.seq-item .txt')].map(x=>x.textContent);
    answers[idx]=order;
    ok = JSON.stringify(order)===JSON.stringify(q.correct);
    modelTxt = 'Correct order:<br>• ' + q.correct.join('<br>• ');
    qCard.querySelectorAll('.seq-item').forEach(li=>li.draggable=false);
  }
  else if(q.type==='MATCH'){
    const pairs = getPairs();
    if(pairs.length !== q.stems.length){ showExplanation(false, "Please pair all items before submitting."); return; }
    let good=0;
    pairs.forEach(pr=>{ if(q.correct.some(c=>c.s===pr.s && c.r===pr.r)) good++; });
    ok = good===q.stems.length;
    modelTxt = 'Correct pairs:<br>' + q.correct.map(c=>`• ${q.stems[c.s]} → ${q.responses[c.r]}`).join('<br>');
    qCard.querySelectorAll('.mitem').forEach(m=>m.style.pointerEvents='none');
  }
  else if(q.type==='RTC'){
    const subAns = answers[idx] && answers[idx].subs ? answers[idx].subs : new Array(q.subs.length).fill(null);
    q.subs.forEach((s,si)=>{
      if(s.stype==='FTB'){
        const input = qCard.querySelector(`.rtc-ftb[data-si="${si}"]`);
        if(input){ subAns[si]=(input.value||'').trim().toLowerCase(); input.setAttribute('disabled',''); }
      } else if(s.stype==='MCQ'){
        qCard.querySelectorAll(`.option[data-si="${si}"]`).forEach(o=>o.setAttribute('disabled',''));
      }
    });
    answers[idx] = {subs: subAns, _scored: true}; // Mark RTC as scored after first attempt
    let allOk=true;
    q.subs.forEach((s,si)=>{
      if(s.stype==='MCQ'){
        const sel = subAns[si];
        qCard.querySelectorAll(`.option[data-si="${si}"]`).forEach((o,i)=>{
          if(i===s.correct) o.classList.add('is-correct');
          else if(i===sel) o.classList.add('is-wrong');
        });
        if(sel!==s.correct) allOk=false;
      }else if(s.stype==='FTB'){
        const val = (subAns[si]||'').toLowerCase();
        const alts = [ (s.answer||'').toLowerCase(), ...((s.alt||[]).map(x=>x.toLowerCase())) ];
        if(!alts.includes(val)) allOk=false;
      }
    });
    ok = allOk;
    modelTxt = 'Review each part using the highlights. Green is correct, red is incorrect.';
  }
  
  // Play sound
  if (soundReady) {
    if (ok) {
        correctSynth.triggerAttackRelease("C5", "8n");
    } else {
        wrongSynth.triggerAttackRelease("C3", "8n");
    }
  }

  if(ok && !scored){
    score += 10;
    if(q.type==='RTC') answers[idx]._scored = true; else answers[idx] = '__scored__';
  }
  badgeScore.textContent = `Score: ${score}`;
  showExplanation(ok, modelTxt);
}

/* ---------- HINT LOGIC ---------- */
btnHint.addEventListener('click', () => {
    if (hintsUsed[idx]) return;
    
    // Penalize and update state
    score -= 5;
    hintsUsed[idx] = true;
    btnHint.disabled = true;
    badgeScore.textContent = `Score: ${score}`;

    // Show hint in modal
    const q = QUIZ.questions[idx];
    hintText.textContent = q.hint || "No hint available for this question.";
    hintModal.classList.add('visible');
});

closeHintModal.addEventListener('click', () => {
    hintModal.classList.remove('visible');
});
hintModal.addEventListener('click', (e) => {
    if (e.target === hintModal) {
        hintModal.classList.remove('visible');
    }
});


/* ---------- NAV ---------- */
btnPrev.addEventListener('click', ()=>{ if(idx>0){ idx--; render(); }});
btnNext.addEventListener('click', ()=>{ if(idx<QUIZ.questions.length-1){ idx++; render(); }});
btnSubmit.addEventListener('click', grade);
btnSkip.addEventListener('click', ()=>{ answers[idx]='__skipped__'; showExplanation(false,"Marked as skipped."); });
btnFinish.addEventListener('click', ()=>{
  const totalQuestions = QUIZ.questions.length;
  progressBar.style.width='100%';
  const totalMarks = totalQuestions * 10;
  qCard.innerHTML = `
    <div class="q-text" style="font-size:1.15rem;">🎉 Quiz Complete!</div>
    <p style="margin:.4rem 0 1rem;color:var(--muted)">You finished all ${totalQuestions} questions.</p>
    <div class="expl expl--ok" style="display:block"><strong>Your final score:</strong> ${score} / ${totalMarks}</div>
  `;
  btnPrev.disabled=true; btnNext.style.display='none'; btnSubmit.style.display='none'; btnSkip.style.display='none'; btnFinish.style.display='none'; btnHint.style.display='none';
});

/* ---------- INIT ---------- */
document.addEventListener('DOMContentLoaded', render);
</script>
</body>
